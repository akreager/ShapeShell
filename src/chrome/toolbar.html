<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ShapeShell toolbar</title>
<style>
  :root { --bg: #252526; --fg: #d4d4d4; --fg-dim: #8a8a8a; --hover: #37373a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font: 12px/1 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif;
    user-select: none;
    cursor: default;
  }
  /* The bar drags the window; interactive children opt out with no-drag.
     The padding reserves the strip the native window buttons are drawn in —
     env(titlebar-area-*) tracks the GNOME button-layout setting, including
     left-hand layouts, and is unset entirely in fullscreen (hence the fallbacks). */
  .bar {
    display: flex;
    align-items: center;
    height: 32px;
    padding-left: env(titlebar-area-x, 0px);
    padding-right: calc(100vw - env(titlebar-area-width, 100vw) - env(titlebar-area-x, 0px));
    -webkit-app-region: drag;
  }
  .title {
    flex: 1;
    text-align: center;
    padding: 0 8px;
    color: var(--fg-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  button {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 24px;
    margin: 0 2px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--fg);
    cursor: default;
  }
  button:hover { background: var(--hover); }
  /* 16px box for a 16-unit viewBox, so strokes land on the pixel grid. A 2px stroke
     centred on an even coordinate spans whole pixels; 15px/1.7 blurred it. */
  button svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; shape-rendering: crispEdges; }
  /* Balances the tray and hamburger so the title stays optically centred; its width is
     kept in sync with the right-hand controls in script below. */
  .spacer { flex: none; width: 32px; }
  /* Extension tray, left of the hamburger. */
  .tray { display: flex; align-items: center; }
  .tray button { position: relative; width: 26px; }
  .tray img { width: 16px; height: 16px; object-fit: contain; }
  .tray button.disabled img { opacity: .4; }
  /* Fallback mark when an extension ships no readable icon. */
  .tray .letter {
    display: flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 3px;
    background: #4a4a4f; font-size: 10px; text-transform: uppercase;
  }
  .badge {
    position: absolute;
    right: 1px;
    bottom: 1px;
    min-width: 12px;
    padding: 0 2px;
    border-radius: 6px;
    color: #fff;
    font-size: 8px;
    line-height: 10px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="bar">
  <div class="spacer" id="spacer"></div>
  <div class="title" id="title">Onshape</div>
  <div class="tray" id="tray"></div>
  <button id="menu" title="Main menu">
    <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
  </button>
</div>
<script>
  document.getElementById('menu').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    window.shellApi.openMenu(Math.round(r.right), Math.round(r.bottom));
  });

  window.shellApi.onState((s) => {
    document.getElementById('title').textContent = s.title || 'Onshape';
  });

  const tray = document.getElementById('tray');

  window.shellApi.onExtensions((list) => {
    tray.replaceChildren();
    for (const ext of list) {
      const button = document.createElement('button');
      button.title = ext.title || ext.name;
      button.className = ext.enabled ? '' : 'disabled';

      if (ext.icon) {
        const img = document.createElement('img');
        img.src = ext.icon;
        img.alt = '';
        button.append(img);
      } else {
        const letter = document.createElement('span');
        letter.className = 'letter';
        letter.textContent = (ext.name || '?').trim().charAt(0);
        button.append(letter);
      }

      if (ext.badgeText) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = ext.badgeText;
        badge.style.background = ext.badgeColor || '#666';
        button.append(badge);
      }

      button.addEventListener('click', (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        window.shellApi.openExtension(ext.id, Math.round(r.right));
      });
      tray.append(button);
    }
    // Keep the title optically centred as icons come and go.
    document.getElementById('spacer').style.width = `${32 + tray.offsetWidth}px`;
  });
</script>
</body>
</html>
